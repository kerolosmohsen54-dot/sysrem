openapi: 3.1.0
info:
  title: Precision Slate ERP API
  version: 1.2.0
  description: |
    Implemented Laravel API routes. Base path is /api/v1 and the browser UI
    uses same-site HttpOnly session cookies plus CSRF protection. All routes
    deny by default; owner grants are described by the permission matrix.
    Money is returned as decimal strings in EGP. Quantities are integers.
    This contract documents the registered non-HEAD API operations. Paths
    are relative to the /api/v1 server URL; implicit HEAD aliases are not
    documented as separate operations.
    Idempotency-Key is required for replayable mobile business-data writes.
    Authentication lifecycle routes and browser-only owner device
    administration are control-plane actions, not offline queue operations.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: example.invalid
tags:
  - name: Auth
  - name: Users
  - name: Audit
  - name: Customers
  - name: Sales
  - name: Orders and deliveries
  - name: Catalog
  - name: Inventory
  - name: Containers
  - name: Finance
  - name: Reports
  - name: Mobile
security:
  - sessionCookie: []
paths:
  /mobile/auth/login:
    post:
      tags: [Mobile]
      operationId: mobileLogin
      summary: Issue a mobile-only bearer token and register a device
      security: []
      description: Password login is rate limited to five requests per minute. The driver and users without mobile.use are denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username: { type: string, maxLength: 100 }
                password: { type: string, format: password, maxLength: 1024 }
                device_name: { type: string, maxLength: 160 }
                device_model: { type: [string, 'null'], maxLength: 160 }
      responses:
        '201':
          description: Device bearer token issued once; token is scoped to mobile endpoints. Store it in secure device storage and never log it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileLoginResponse' }
              examples:
                issued:
                  value:
                    data:
                      access_token: example-only-token-not-valid
                      token_type: Bearer
                      expires_at: '2026-11-11 12:00:00'
                      device: { id: 3, name: 'Office phone', model: 'Example device model' }
                    meta: { request_id: example-request-id }
        '401': { description: Invalid username or password. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Active device limit reached. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /mobile/auth/me:
    get:
      tags: [Mobile]
      operationId: mobileCurrentUser
      summary: Return mobile user, device and effective permissions
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      responses:
        '200':
          description: Current user, device and complete active-role permission list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileCurrentUserResponse' }
              examples:
                currentUser:
                  value:
                    data:
                      user:
                        id: 8
                        username: example-owner
                        display_name: 'Example Owner'
                        permissions: [mobile.use, mobile.balances.view, mobile.messages.view]
                      device: { id: 3, name: 'Office phone', model: 'Example device model' }
                    meta: { request_id: example-request-id }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mobile/auth/confirm-password:
    post:
      tags: [Mobile]
      operationId: confirmMobilePassword
      summary: Start the ten-minute high-risk action window
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      description: Rate limited to five attempts per minute. Confirmation is device-specific.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, format: password, maxLength: 1024 } }
      responses:
        '200': { description: Password confirmed for ten minutes on this device. }
        '401': { $ref: '#/components/responses/ReauthenticationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /mobile/auth/logout:
    post:
      tags: [Mobile]
      operationId: mobileLogout
      summary: Revoke the current mobile device token
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      responses:
        '200': { description: Device token revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /mobile/devices:
    get:
      tags: [Mobile]
      operationId: mobileListDevices
      summary: List mobile devices and their sources
      x-permission: mobile.devices.manage
      x-step-up: 10 minutes
      responses:
        '200': { description: Paginated owner device list; token values and hashes are never returned. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /mobile/devices/{deviceId}:
    patch:
      tags: [Mobile]
      operationId: mobileRenameDevice
      summary: Rename a mobile device
      x-permission: mobile.devices.manage
      x-step-up: 10 minutes
      x-csrf-required: true
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 160 } }
      responses:
        '200': { description: Device renamed and change audited. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /mobile/devices/{deviceId}/revoke:
    post:
      tags: [Mobile]
      operationId: mobileRevokeDevice
      summary: Revoke a mobile device immediately
      x-permission: mobile.devices.manage
      x-step-up: 10 minutes
      x-csrf-required: true
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Device token revoked; future requests fail authentication. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /mobile/channels:
    get:
      tags: [Mobile]
      operationId: mobileListChannels
      summary: List active and paused payment channels
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      description: Paginated; balance_egp is returned only to users with mobile.balances.view.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: channel_type, in: query, schema: { type: string, enum: [bank, instapay, wallet, post_office, other] } }
        - { name: status, in: query, schema: { type: string, enum: [active, paused] } }
      responses:
        '200':
          description: Paginated channels; balances are server-computed decimal EGP strings and omitted without mobile.balances.view.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MobileChannel' } }
                  meta: { $ref: '#/components/schemas/MobilePageMetadata' }
              examples:
                channelPage:
                  value:
                    data: [{ id: 4, treasury_account_id: 9, name: 'فودافون كاش 1', channel_type: wallet, identifier: '01000000000', status: active, balance_egp: '250.75' }]
                    meta: { current_page: 1, last_page: 1, per_page: 50, total: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Mobile]
      operationId: mobileCreateChannel
      summary: Create a treasury-backed mobile payment channel
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      x-step-up: mobile password confirmation, ten minutes
      x-idempotency-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, channel_type]
              properties:
                name: { type: string, maxLength: 160 }
                channel_type: { type: string, enum: [bank, instapay, wallet, post_office, other] }
                identifier: { type: [string, 'null'], maxLength: 160 }
                opening_balance_egp: { type: string, pattern: '^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,2})?$' }
                opening_date: { type: string, format: date }
      responses:
        '201':
          description: Channel and treasury account created; optional opening amount is posted as a dated opening treasury entry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileChannel' } }
              examples:
                created:
                  value:
                    data: { id: 4, treasury_account_id: 9, name: 'فودافون كاش 1', channel_type: wallet, identifier: '01000000000', status: active }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { description: Mobile password confirmation required. }
  /mobile/channels/{channelId}:
    patch:
      tags: [Mobile]
      operationId: mobileUpdateChannel
      summary: Rename, reclassify, identify, pause or resume a channel
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      x-idempotency-required: true
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 160 }
                channel_type: { type: string, enum: [bank, instapay, wallet, post_office, other] }
                identifier: { type: [string, 'null'], maxLength: 160 }
                status: { type: string, enum: [active, paused] }
      responses:
        '200':
          description: Channel updated and audited; its balance remains treasury-ledger-derived.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileChannel' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Channel not found or archived. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Mobile]
      operationId: mobileArchiveChannel
      summary: Archive a channel and its unregistered messages
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      x-step-up: mobile password confirmation, ten minutes
      x-idempotency-required: true
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Channel and its sources archived; new or needs_review messages become archived. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Channel not found or already archived. }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { description: Mobile password confirmation required. }
  /mobile/sources:
    get:
      tags: [Mobile]
      operationId: mobileListSources
      summary: List shared source definitions and this device's capture settings
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Shared source definitions with this device's local enabled state and direction switches; JSON parser/keyword fields are JSON values.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MobileSource' } }
                  meta: { $ref: '#/components/schemas/MobilePageMetadata' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Mobile]
      operationId: mobileCreateSource
      summary: Create a shared source definition and enable it on this device
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      x-idempotency-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, source_kind, read_deposits, read_withdrawals]
              properties:
                channel_id: { type: integer, minimum: 1 }
                source_kind: { type: string, enum: [sms, notification] }
                sender_identifier: { type: [string, 'null'], maxLength: 200 }
                notification_package_names: { type: array, maxItems: 20, items: { type: string, maxLength: 255 } }
                read_deposits: { type: boolean }
                read_withdrawals: { type: boolean }
                is_enabled: { type: boolean, default: true, description: Enabled state on the authenticated device only. }
                default_read_deposits: { type: boolean, description: Shared default for this device's deposit switch when configuring the source. }
                default_read_withdrawals: { type: boolean, description: Shared default for this device's withdrawal switch when configuring the source. }
                deposit_keywords: { type: array, maxItems: 50, items: { type: string, maxLength: 160 } }
                withdrawal_keywords: { type: array, maxItems: 50, items: { type: string, maxLength: 160 } }
                parser_rule_version: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
                parser_rule: { type: [object, 'null'], additionalProperties: true }
                redacted_sample_message: { type: [string, 'null'], maxLength: 4000 }
      responses:
        '201':
          description: Shared source definition created, with capture settings attached to the authenticated device.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileSource' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/sources/{sourceId}:
    patch:
      tags: [Mobile]
      operationId: mobileUpdateSource
      summary: Update a shared source definition or this device's capture settings
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      x-idempotency-required: true
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                channel_id: { type: integer, minimum: 1 }
                source_kind: { type: string, enum: [sms, notification] }
                sender_identifier: { type: [string, 'null'], maxLength: 200 }
                notification_package_names: { type: array, maxItems: 20, items: { type: string, maxLength: 255 } }
                read_deposits: { type: boolean }
                read_withdrawals: { type: boolean }
                is_enabled: { type: boolean, description: Enabled state on the authenticated device only. }
                default_read_deposits: { type: boolean, description: Shared default for this device's deposit switch when configuring the source. }
                default_read_withdrawals: { type: boolean, description: Shared default for this device's withdrawal switch when configuring the source. }
                deposit_keywords: { type: [array, 'null'], maxItems: 50, items: { type: string, maxLength: 160 } }
                withdrawal_keywords: { type: [array, 'null'], maxItems: 50, items: { type: string, maxLength: 160 } }
                parser_rule_version: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
                parser_rule: { type: [object, 'null'], additionalProperties: true }
                redacted_sample_message: { type: [string, 'null'], maxLength: 4000 }
                status: { type: string, enum: [active, paused] }
      responses:
        '200':
          description: Source updated and audited.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileSource' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Source or active channel not found. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Mobile]
      operationId: mobileArchiveSource
      summary: Archive a shared source and its unregistered messages
      security: [{ mobileBearer: [] }]
      x-permission: mobile.channels.manage
      x-idempotency-required: true
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Source archived; new or needs_review messages become archived. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Source not found or already archived. }
        '409': { $ref: '#/components/responses/Conflict' }
  /mobile/categories:
    get:
      tags: [Mobile]
      operationId: mobileListCategories
      summary: List active withdrawal categories
      security: [{ mobileBearer: [] }]
      x-permission: mobile.withdrawals.register or mobile.categories.manage
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: category_kind, in: query, schema: { type: string, enum: [expense, transfer] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Active categories; transfer categories include their target account. Boolean fields are JSON booleans.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MobileCategory' } }
                  meta: { $ref: '#/components/schemas/MobilePageMetadata' }
              examples:
                seededCategories:
                  value:
                    data:
                      - { id: 1, name: الدرج, category_kind: transfer, expense_category_id: null, target_treasury_account_id: 2, requires_notes: false, is_system: true, is_active: true, expense_category_name: null, target_account_name: الخزنة }
                      - { id: 2, name: الرواتب, category_kind: expense, expense_category_id: 1, target_treasury_account_id: null, requires_notes: false, is_system: true, is_active: true, expense_category_name: الرواتب, target_account_name: null }
                    meta: { current_page: 1, last_page: 1, per_page: 100, total: 4 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Mobile]
      operationId: mobileCreateCategory
      summary: Create an expense or treasury transfer category
      security: [{ mobileBearer: [] }]
      x-permission: mobile.categories.manage
      x-step-up: mobile password confirmation, ten minutes
      x-idempotency-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category_kind]
              properties:
                name: { type: string, maxLength: 160 }
                category_kind: { type: string, enum: [expense, transfer] }
                target_treasury_account_id: { type: integer, minimum: 1, description: Required only for transfer. }
                requires_notes: { type: boolean, default: false }
      responses:
        '201':
          description: Category created and audited; expense categories reuse the existing expense category table.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileCategory' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { description: Mobile password confirmation required. }
  /mobile/categories/{categoryId}:
    patch:
      tags: [Mobile]
      operationId: mobileUpdateCategory
      summary: Rename, configure notes, change transfer target or activate a category
      security: [{ mobileBearer: [] }]
      x-permission: mobile.categories.manage
      x-idempotency-required: true
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 160 }
                target_treasury_account_id: { type: integer, minimum: 1 }
                requires_notes: { type: boolean }
                is_active: { type: boolean }
      responses:
        '200':
          description: Category updated and audited.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileCategory' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Category not found. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Mobile]
      operationId: mobileArchiveCategory
      summary: Deactivate a category without deleting financial history
      security: [{ mobileBearer: [] }]
      x-permission: mobile.categories.manage
      x-idempotency-required: true
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Category deactivated; recorded documents remain unchanged. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Category not found. }
        '409': { $ref: '#/components/responses/Conflict' }
  /mobile/messages/batch:
    post:
      tags: [Mobile]
      operationId: mobileIngestMessageBatch
      summary: Ingest messages and classify directions from source keywords
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      x-idempotency-required: true
      description: |
        Accepts 1–100 messages (raw_text at most 5000 characters each).
        Every source definition is shared, but must be enabled for the
        authenticated device and have an active channel. The API normalizes
        phone-number senders (including +20, 0020, and leading-0 forms) and
        compares non-numeric sender names case-insensitively. The API, not the
        submitted type, decides direction from the source's deposit and
        withdrawal keywords and this device's direction switches. A message
        matching both keyword sets is stored as ambiguous with needs_review;
        a message matching neither set rejects the entire request and is not
        stored. Verification-code messages also reject the request. Missing
        or unclear amounts are stored as needs_review. Duplicate identity is
        normalized sender + EGP amount + device-reported received time +
        SHA-256 of the original text, globally across devices and users.
        Original text is never included in audit records or application logs.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [source_id, sender, received_at, raw_text]
                    properties:
                      source_id: { type: integer, minimum: 1 }
                      type: { type: string, enum: [deposit, withdrawal], description: Optional client consistency hint; the API classifies the direction from configured keywords. }
                      amount: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,2})?$', description: EGP decimal string to exact piastres; omit or null when unclear. }
                      sender: { type: string, maxLength: 200, description: Exact SMS sender identifier or notification app package name. }
                      received_at: { type: string, format: date-time, description: Device-reported time, normalized to UTC by the API. }
                      raw_text: { type: string, maxLength: 5000, writeOnly: true }
            examples:
              walletDeposit:
                summary: Synthetic wallet deposit; never use a real customer message as an OpenAPI example
                value:
                  messages:
                    - source_id: 7
                      type: deposit
                      amount: '125.50'
                      sender: WalletSender
                      received_at: '2026-10-13T12:30:00Z'
                      raw_text: 'Deposit received EGP 125.50'
      responses:
        '201':
          description: Per-input result with created or duplicate status and accepted/duplicate counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileMessageBatchResponse' }
              examples:
                accepted:
                  value:
                    data:
                      results: [{ index: 0, message_id: 314, status: new }]
                      accepted_count: 1
                      duplicate_count: 0
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Invalid, inactive, unmatched, direction-disabled, keyword-unmatched, or OTP/verification message; nothing from this batch is stored. }
  /mobile/customers:
    post:
      tags: [Mobile, Customers]
      operationId: mobileCreateCustomer
      summary: Create a customer for a mobile deposit picker
      security: [{ mobileBearer: [] }]
      x-permission: mobile.customers.create
      x-idempotency-required: true
      description: Uses the same customer validation, unique-phone rule, audit log, and creation service as the web endpoint. The required Idempotency-Key makes retries return the original customer without creating another row.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/CustomerInput' }
                - { type: object, required: [name] }
            examples:
              basicCustomer:
                value: { name: 'Example customer', phone: '01000000000', email: null, payment_terms: 'Cash' }
      responses:
        '201':
          description: The created customer; replay with the same key returns the original response.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/MobileCustomer' } }
              examples:
                created:
                  value:
                    data:
                      id: 41
                      name: 'Example customer'
                      phone: '01000000000'
                      email: null
                      address: null
                      salesperson: null
                      tax_number: null
                      payment_terms: Cash
                      governorate: null
                      credit_limit: '0.0000'
                      notes: null
                      is_active: true
                      created_at: '2026-10-13 12:30:00'
                      updated_at: '2026-10-13 12:30:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/sync:
    get:
      tags: [Mobile]
      operationId: mobileSync
      summary: Get a cursor-based delta of mobile master data and statuses
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      description: |
        Cursor zero (or a cursor ahead of the current high-water mark) returns
        an initial snapshot of active channels, categories, and shared active
        source definitions with this device's local settings. Later calls
        return changed customer/channel/category/source definitions, this-
        device source settings, and this-user message-status records. A page is
        capped at 500 sync events; when has_more is true, send the returned
        cursor again to continue. Channel balances are present only with
        mobile.balances.view. Raw message text is never included.
      parameters:
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: Delta arrays for customers, channels, categories, sources, and message statuses, with the next cursor, has_more, and server_time. Raw message text is never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileSyncResponse' }
              examples:
                initialSnapshot:
                  value:
                    data:
                      cursor: 220
                      has_more: false
                      customers: []
                      channels:
                        - id: 4
                          treasury_account_id: 9
                          name: 'فودافون كاش 1'
                          channel_type: wallet
                          identifier: '01000000000'
                          status: active
                          balance_egp: '250.75'
                      categories: []
                      sources:
                        - id: 7
                          device_id: 3
                          channel_id: 4
                          source_kind: sms
                          sender_identifier: WalletSender
                          notification_package_names: null
                          read_deposits: true
                          read_withdrawals: false
                          is_enabled: true
                          default_read_deposits: true
                          default_read_withdrawals: false
                          deposit_keywords: ['Deposit received']
                          withdrawal_keywords: []
                          parser_rule_version: 1
                          parser_rule: { amountPattern: '[0-9]+\\.[0-9]{2}' }
                          redacted_sample_message: null
                          status: active
                          created_at: '2026-10-12 12:00:00'
                          updated_at: '2026-10-12 12:00:00'
                      messages: []
                      server_time: '2026-10-13T12:30:00+00:00'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/ping:
    get:
      tags: [Mobile]
      operationId: mobilePing
      summary: Return the current sync high-water cursor
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      description: Cheap polling endpoint returning only the latest cursor and server time; it does not return entity data.
      responses:
        '200':
          description: Current cursor and server_time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobilePingResponse' }
              examples:
                current:
                  value: { data: { cursor: 220, server_time: '2026-10-13T12:30:00+00:00' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mobile/messages:
    get:
      tags: [Mobile]
      operationId: mobileListMessages
      summary: List this user's messages with filters and pagination
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      description: raw_text is included only when the caller also has mobile.messages.view. Amounts are decimal EGP strings; this endpoint does not expose any other user's devices.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: type, in: query, schema: { type: string, enum: [deposit, withdrawal] } }
        - { name: status, in: query, schema: { type: string, enum: [new, registered, ignored, needs_review, archived] } }
        - { name: channel_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 160 } }
        - { name: sort_by, in: query, schema: { type: string, enum: [received_at, server_received_at, amount, type, status, id] } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: Paginated message items with EGP amounts and status. raw_text is included only with mobile.messages.view.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MobileMessageItem' } }
                  meta: { $ref: '#/components/schemas/MobilePageMetadata' }
              examples:
                messagePage:
                  value:
                    data:
                      - { id: 314, source_id: 7, channel_id: 4, channel_name: 'فودافون كاش 1', type: deposit, amount_egp: '125.50', sender_identifier: WalletSender, received_at: '2026-10-13 12:30:00', server_received_at: '2026-10-13 12:30:01', status: new, registered_source: null, registered_document_type: null, registered_document_id: null, reviewed_at: null, archived_at: null, raw_text: 'Deposit received EGP 125.50' }
                    meta: { current_page: 1, last_page: 1, per_page: 50, total: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/messages/{messageId}/amount:
    patch:
      tags: [Mobile]
      operationId: mobileReviewMessageAmount
      summary: Enter or correct an amount on a message requiring review
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      x-idempotency-required: true
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_egp]
              properties:
                amount_egp: { type: string, pattern: '^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,2})?$', description: Positive EGP decimal string to exact piastres. }
      responses:
        '200':
          description: Amount review audited; needs_review becomes new, while archived remains archived and cannot be registered automatically.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, amount_egp, status, reviewed_at]
                    properties:
                      id: { type: integer }
                      amount_egp: { $ref: '#/components/schemas/EgpAmount' }
                      status: { type: string, enum: [new, archived] }
                      reviewed_at: { type: string }
              examples:
                reviewed:
                  value: { data: { id: 314, amount_egp: '125.50', status: new, reviewed_at: '2026-10-13 12:30:00' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Message is not owned by the authenticated user. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Amount is invalid or the message is not in needs_review or archived status. }
  /mobile/messages/{messageId}/ignore:
    post:
      tags: [Mobile]
      operationId: mobileIgnoreMessage
      summary: Ignore an unregistered message
      security: [{ mobileBearer: [] }]
      x-permission: mobile.use
      x-idempotency-required: true
      description: Marks a new or needs_review message ignored. Archived and registered messages cannot be ignored. Raw message text is not written to the audit log.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Message is ignored; repeating the same idempotency key returns the original response.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [ignored] }
              examples:
                ignored:
                  value: { data: { id: 42, status: ignored } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Message is not owned by the authenticated user's devices. }
        '409': { description: Message is registered or archived and cannot be ignored. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/messages/{messageId}/register-deposit:
    post:
      tags: [Mobile]
      operationId: mobileRegisterDeposit
      summary: Register a message deposit as an unapplied customer collection
      security: [{ mobileBearer: [] }]
      x-permission: mobile.deposits.register
      x-idempotency-required: true
      description: |
        Posts the full message amount as an unapplied collection and credits
        the message channel treasury account in one transaction. Message
        deposits are marked is_unverified_payment=true because message text
        is not proof of payment. Explicitly reviewed archived messages can
        be registered; unreviewed archived messages cannot.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id: { type: integer, minimum: 1 }
                notes: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '201':
          description: Unapplied collection, its treasury entry, and updated message reference; recording_source is sms or notification and is_unverified_payment is true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileDepositResult' }
              examples:
                messageDeposit:
                  value:
                    data:
                      id: 802
                      message_id: 314
                      customer_id: 41
                      channel_id: 4
                      amount_egp: '125.50'
                      recording_source: sms
                      is_unverified_payment: true
                      receipt: { id: 802, receipt_date: '2026-10-13', amount: '125.50', unapplied_amount: '125.50' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Message is not owned by this user's devices. }
        '409': { description: Message is already registered, has an incompatible state, or has lost its source/channel. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/deposits/manual:
    post:
      tags: [Mobile]
      operationId: mobileRegisterManualDeposit
      summary: Record a manual post-office deposit
      security: [{ mobileBearer: [] }]
      x-permission: mobile.deposits.register
      x-idempotency-required: true
      description: Requires an active post_office payment channel. Posts the entire amount as unapplied and credits its treasury account. Manual deposits are not marked as message-unverified.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, customer_id, amount_egp, receipt_date]
              properties:
                channel_id: { type: integer, minimum: 1 }
                customer_id: { type: integer, minimum: 1 }
                amount_egp: { $ref: '#/components/schemas/EgpAmount' }
                receipt_date: { type: string, format: date }
                notes: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '201':
          description: Unapplied collection and linked treasury entry; recording_source is manual and is_unverified_payment is false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileDepositResult' }
              examples:
                manualDeposit:
                  value:
                    data:
                      id: 803
                      customer_id: 41
                      channel_id: 5
                      amount_egp: '125.50'
                      recording_source: manual
                      is_unverified_payment: false
                      receipt: { id: 803, receipt_date: '2026-10-13', amount: '125.50', unapplied_amount: '125.50' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The channel is not an active post-office channel. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /mobile/messages/{messageId}/register-withdrawal:
    post:
      tags: [Mobile]
      operationId: mobileRegisterWithdrawal
      summary: Register a message withdrawal as an expense or treasury transfer
      security: [{ mobileBearer: [] }]
      x-permission: mobile.withdrawals.register
      x-idempotency-required: true
      description: Posts through the existing expense or treasury transfer service, then marks the message registered in the same transaction. Categories with requires_notes=true reject blank notes. The category is an expense or transfer kind; transfer categories use their configured target treasury account.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id: { type: integer, minimum: 1 }
                notes: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '201':
          description: Posted expense or transfer and updated registered message reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileWithdrawalResult' }
              examples:
                withdrawal:
                  value:
                    data:
                      id: 944
                      message_id: 315
                      channel_id: 4
                      category_id: 2
                      amount_egp: '50.00'
                      recording_source: notification
                      document_type: expense
                      notes: 'Warehouse supplies'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Message is not owned by this user's devices. }
        '409': { description: Message is already registered or has an incompatible state. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /health:
    get:
      tags: [Auth]
      operationId: health
      summary: Public API health check
      security: []
      responses:
        '200':
          description: API is responding.
  /auth/login-options:
    get:
      tags: [Auth]
      operationId: loginOptions
      summary: List active usernames for the login selector
      security: []
      responses:
        '200':
          description: Active login names only; passwords and contact details are never exposed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [username, display_name]
                      properties:
                        username: { type: string }
                        display_name: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Start a same-site session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 100 }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated; sets HttpOnly session and readable CSRF cookies.
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Return the current user
      x-permission: users.view_self
      responses:
        '200':
          description: Authenticated user and every effective permission granted by active roles.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        type: object
                        required: [id, username, display_name, permissions]
                        properties:
                          id: { type: integer }
                          username: { type: string }
                          display_name: { type: string }
                          permissions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/reauth:
    post:
      tags: [Auth]
      operationId: reauthenticate
      summary: Verify password for a 10-minute financial step-up window
      x-permission: users.view_self
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, format: password } }
      responses:
        '200': { description: Step-up window started. }
        '401': { $ref: '#/components/responses/ReauthenticationFailed' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      x-permission: sessions.revoke_self
      x-csrf-required: true
      responses:
        '200': { description: Session revoked and cookies cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
  /users/{userId}/password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Manually set another user's password
      description: Owner-only; no email reset flow exists. Password is entered by the target user through an authorized owner workflow.
      x-permission: users.manage
      x-csrf-required: true
      x-step-up: 10 minutes
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password, new_password_confirmation]
              properties:
                new_password: { type: string, format: password, minLength: 12 }
                new_password_confirmation: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: Password changed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      x-permission: users.manage
      x-step-up: 10 minutes
      parameters:
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Paginated users with active roles and effective permission codes; password hashes are never returned. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
    post:
      tags: [Users]
      operationId: createUser
      x-permission: users.manage
      x-csrf-required: true
      x-step-up: 10 minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, password, password_confirmation, role_codes]
              properties:
                username: { type: string, maxLength: 100 }
                display_name: { type: string, maxLength: 160 }
                phone: { type: [string, 'null'], maxLength: 32 }
                email: { type: [string, 'null'], format: email }
                password: { type: string, format: password, minLength: 12 }
                password_confirmation: { type: string, format: password, minLength: 12 }
                role_codes: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
      responses:
        '201': { description: User created and assigned roles. Password/hash are excluded from the response. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /users/{userId}:
    put:
      tags: [Users]
      operationId: updateUser
      x-permission: users.manage
      x-csrf-required: true
      x-step-up: 10 minutes
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username: { type: string, maxLength: 100 }
                display_name: { type: string, maxLength: 160 }
                phone: { type: [string, 'null'], maxLength: 32 }
                email: { type: [string, 'null'], format: email }
                is_active: { type: boolean }
