        '200': { description: Customer rows include the backend-computed signed receivable balance and current unapplied collection amount; includes pagination metadata. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/customers/{customerId}/statement:
    get:
      tags: [Reports]
      operationId: reportCustomerStatement
      summary: Dated customer statement
      x-permission: reports.customer_statement.view
      x-step-up: 10 minutes
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
        - { name: from_date, in: query, schema: { type: string, format: date } }
        - { name: to_date, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Paginated posted invoices, credit notes, dated opening-balance documents, and collection receipts with current applied/unapplied amounts. Collection rows include recording_source and is_unverified_payment; summary contains current balance and total unapplied collections. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/stock:
    get:
      tags: [Reports]
      operationId: reportStock
      summary: Stock by product and warehouse
      x-permission: inventory.view
      x-step-up: 10 minutes
      parameters:
        - { name: product_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: warehouse_id, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Paginated product/warehouse stock quantities. Cost and inventory-value fields are returned only to callers with costs.view; driver responses omit them. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/stock-movements:
    get:
      tags: [Reports]
      operationId: reportStockMovements
      summary: Paginated stock movement history
      x-permission: inventory.view
      x-step-up: 10 minutes
      parameters:
        - { name: product_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: warehouse_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: movement_type, in: query, schema: { type: string, enum: [opening, receipt, sale, return, transfer, adjustment, damage, container_receipt, reversal] } }
        - { name: from_date, in: query, schema: { type: string, format: date } }
        - { name: to_date, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Filterable paginated movements; per-unit and extended movement costs are returned only when the caller has costs.view. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/sales:
    get:
      tags: [Reports]
      operationId: reportSales
      summary: Filterable sales-document list
      x-permission: invoices.view
      x-step-up: 10 minutes
      parameters:
        - { name: customer_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, reversed, cancelled] } }
        - { name: document_number, in: query, schema: { type: string, maxLength: 80 } }
        - { name: from_date, in: query, schema: { type: string, format: date } }
        - { name: to_date, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Paginated invoices and credit notes with stored document totals. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/container-costs:
    get:
      tags: [Reports]
      operationId: reportContainerCosts
      summary: Container cost, payment, and inventory-allocation summary
      x-permission: reports.container_costs.view
      x-step-up: 10 minutes
      parameters:
        - { name: container_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: status, in: query, schema: { type: string, enum: [estimated, incurred, paid, cancelled] } }
        - { name: from_date, in: query, schema: { type: string, format: date } }
        - { name: to_date, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Paginated container summaries with exact EGP totals for recorded costs, payments, unpaid amounts, and landed-cost allocations. Cancelled costs are excluded by default. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/invoice-profit:
    get:
      tags: [Reports]
      operationId: reportInvoiceProfit
      summary: Provisional invoice profit and markup
      description: Formula is explicitly provisional pending accountant confirmation. It uses issue-time line cost snapshots and excludes tax from invoice revenue.
      x-permission: [profit.view, markup.view]
      x-step-up: 10 minutes
      parameters:
        - { name: customer_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from_date, in: query, schema: { type: string, format: date } }
        - { name: to_date, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/ListPage' }
        - { $ref: '#/components/parameters/ListPerPage' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSortBy' }
        - { $ref: '#/components/parameters/ListSortDirection' }
      responses:
        '200': { description: Paginated posted invoices with revenue excluding tax, snapshot cost, provisional profit and markup. Missing snapshots yield null profitability values; zero cost yields null markup. Formula and PROVISIONAL status are included in metadata and each row. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
  /reports/dashboard:
    get:
      tags: [Reports]
      operationId: reportDashboard
      summary: Permission-filtered dashboard summary
      description: "Each optional summary field is calculated and returned only when the caller has the corresponding permission: invoices.view, inventory.view, reports.customer_balances.view, or treasury.view."
      x-permission: reports.dashboard.view
      x-step-up: 10 minutes
      responses:
        '200': { description: Posted invoice totals issued today (including tax), aggregate on-hand units across warehouses, positive net customer receivables, and/or per-account treasury balances, with unauthorized sections omitted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '428': { $ref: '#/components/responses/StepUpRequired' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: precision_slate_session
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque device token
  parameters:
    ListPage: { name: page, in: query, required: false, description: One-based page number., schema: { type: integer, minimum: 1, default: 1 } }
    ListPerPage: { name: per_page, in: query, required: false, description: Maximum 100 items; endpoint defaults may differ., schema: { type: integer, minimum: 1, maximum: 100 } }
    ListSearch: { name: search, in: query, required: false, description: Substring search across the endpoint's documented searchable fields., schema: { type: string, minLength: 1, maxLength: 160 } }
    ListSortBy: { name: sort_by, in: query, required: false, description: Endpoint-specific allowlisted sort field; unsupported values return 422., schema: { type: string } }
    ListSortDirection: { name: sort_direction, in: query, required: false, description: Sort direction; defaults to the endpoint's configured order., schema: { type: string, enum: [asc, desc] } }
    CustomerId: { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ReceiptId: { name: receiptId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    AllocationId: { name: allocationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    DeliveryId: { name: deliveryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    WarehouseId: { name: warehouseId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ContainerId: { name: containerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
  schemas:
    EgpAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$'
      description: Decimal string amount in EGP; never a JSON floating-point number.
      examples: ['125.50']
    MobilePageMetadata:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    MobileChannel:
      type: object
      required: [id, treasury_account_id, name, channel_type, status]
      properties:
        id: { type: integer }
        treasury_account_id: { type: integer }
        name: { type: string }
        channel_type: { type: string, enum: [bank, instapay, wallet, post_office, other] }
        identifier: { type: [string, 'null'] }
        status: { type: string, enum: [active, paused] }
        balance_egp: { $ref: '#/components/schemas/EgpAmount' }
    MobileSource:
      type: object
      required: [id, channel_id, source_kind, is_enabled, read_deposits, read_withdrawals, status]
      properties:
        id: { type: integer }
        device_id: { type: integer }
        channel_id: { type: integer }
        channel_name: { type: string }
        channel_status: { type: string, enum: [active, paused] }
        source_kind: { type: string, enum: [sms, notification] }
        sender_identifier: { type: [string, 'null'] }
        notification_package_names: { type: [array, 'null'], items: { type: string } }
        is_enabled: { type: boolean, description: Capture enabled on the requesting device. }
        read_deposits: { type: boolean }
        read_withdrawals: { type: boolean }
        default_read_deposits: { type: boolean, description: Shared default for configuring the device's deposit switch. }
        default_read_withdrawals: { type: boolean, description: Shared default for configuring the device's withdrawal switch. }
        deposit_keywords: { type: [array, 'null'], items: { type: string } }
        withdrawal_keywords: { type: [array, 'null'], items: { type: string } }
        parser_rule_version: { type: [integer, 'null'] }
        parser_rule: { type: [object, array, 'null'], additionalProperties: true }
        redacted_sample_message: { type: [string, 'null'] }
        status: { type: string, enum: [active, paused] }
        created_at: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'] }
    MobileCategory:
      type: object
      required: [id, name, category_kind, requires_notes, is_system, is_active]
      properties:
        id: { type: integer }
        name: { type: string }
        category_kind: { type: string, enum: [expense, transfer] }
        expense_category_id: { type: [integer, 'null'] }
        target_treasury_account_id: { type: [integer, 'null'] }
        requires_notes: { type: boolean }
        is_system: { type: boolean }
        is_active: { type: boolean }
        expense_category_name: { type: [string, 'null'] }
        target_account_name: { type: [string, 'null'] }
    MobileCustomer:
      type: object
      required: [id, name, is_active]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        salesperson: { type: [string, 'null'] }
        tax_number: { type: [string, 'null'] }
        payment_terms: { type: [string, 'null'] }
        governorate: { type: [string, 'null'] }
        credit_limit: { $ref: '#/components/schemas/EgpAmount' }
        notes: { type: [string, 'null'] }
        is_active: { type: boolean }
        status: { type: string, enum: [active, paused, blocked] }
        created_at: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'] }
    MobileLoginResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [access_token, token_type, expires_at, device]
          properties:
            access_token: { type: string, description: Opaque bearer token; shown once and store only in device secure storage. }
            token_type: { type: string, enum: [Bearer] }
            expires_at: { type: string }
            device:
              type: object
              required: [id, name, model]
              properties:
                id: { type: integer }
                name: { type: string }
                model: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            request_id: { type: [string, 'null'] }
    MobileCurrentUserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user, device]
          properties:
            user:
              type: object
              required: [id, username, display_name, permissions]
              properties:
                id: { type: integer }
                username: { type: string }
                display_name: { type: string }
                permissions: { type: array, items: { type: string } }
            device:
              type: object
              required: [id, name, model]
              properties:
                id: { type: integer }
                name: { type: string }
                model: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            request_id: { type: [string, 'null'] }
    MobileMessageItem:
      type: object
      required: [id, source_id, channel_id, type, amount_egp, received_at, server_received_at, status]
      properties:
        id: { type: integer }
        source_id: { type: integer }
        channel_id: { type: integer }
        channel_name: { type: string }
        type: { type: string, enum: [deposit, withdrawal] }
        amount_egp: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,2})?$' }
        sender_identifier: { type: string }
        received_at: { type: string }
        server_received_at: { type: string }
        status: { type: string, enum: [new, registered, ignored, needs_review, archived] }
        registered_source: { type: [string, 'null'], enum: [sms, notification, manual, null] }
        registered_document_type: { type: [string, 'null'] }
        registered_document_id: { type: [integer, 'null'] }
        reviewed_at: { type: [string, 'null'] }
        archived_at: { type: [string, 'null'] }
        raw_text: { type: string, description: Present only with mobile.messages.view; never write to application logs. }
    MobileDepositResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, customer_id, channel_id, amount_egp, recording_source, is_unverified_payment, receipt]
          properties:
            id: { type: integer, description: Sales receipt ID. }
            message_id: { type: integer }
            customer_id: { type: integer }
            channel_id: { type: integer }
            amount_egp: { $ref: '#/components/schemas/EgpAmount' }
            recording_source: { type: string, enum: [sms, notification, manual] }
            is_unverified_payment: { type: boolean, description: True for message-originated deposits because message text is not proof of payment. }
            receipt: { type: object, additionalProperties: true }
    MobileWithdrawalResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, message_id, channel_id, category_id, amount_egp, recording_source, document_type, notes]
          properties:
            id: { type: integer, description: Expense or transfer document ID. }
            message_id: { type: integer }
            channel_id: { type: integer }
            category_id: { type: integer }
            amount_egp: { $ref: '#/components/schemas/EgpAmount' }
            recording_source: { type: string, enum: [sms, notification] }
            document_type: { type: string, enum: [expense, treasury_transfer] }
            notes: { type: [string, 'null'] }
    MobileMessageBatchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [results, accepted_count, duplicate_count]
          properties:
            results:
              type: array
              items:
                type: object
                required: [index, status]
                properties:
                  index: { type: integer, minimum: 0 }
                  status: { type: string, enum: [new, needs_review, duplicate] }
                  type: { type: string, enum: [deposit, withdrawal, ambiguous] }
                  message_id: { type: integer }
                  existing_message_id: { type: integer }
            accepted_count: { type: integer, minimum: 0 }
            duplicate_count: { type: integer, minimum: 0 }
    MobileSyncResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [cursor, has_more, customers, channels, categories, sources, messages, server_time]
          properties:
            cursor: { type: integer, minimum: 0 }
            has_more: { type: boolean }
            customers: { type: array, items: { type: object, additionalProperties: true } }
            channels:
              type: array
              items:
                type: object
                required: [id, treasury_account_id, name, channel_type, status]
                properties:
                  id: { type: integer }
                  treasury_account_id: { type: integer }
                  name: { type: string }
                  channel_type: { type: string, enum: [bank, instapay, wallet, post_office, other] }
                  identifier: { type: [string, 'null'] }
                  status: { type: string, enum: [active, paused] }
                  deleted_at: { type: [string, 'null'] }
                  balance_egp: { $ref: '#/components/schemas/EgpAmount' }
            categories: { type: array, items: { type: object, additionalProperties: true } }
            sources:
              type: array
              items:
                type: object
                required: [id, channel_id, source_kind, is_enabled, read_deposits, read_withdrawals, status]
                properties:
                  id: { type: integer }
                  device_id: { type: integer, description: Device that created the shared definition. }
                  channel_id: { type: integer }
                  source_kind: { type: string, enum: [sms, notification] }
                  sender_identifier: { type: [string, 'null'] }
                  notification_package_names: { type: [array, 'null'], items: { type: string } }
                  is_enabled: { type: boolean }
                  read_deposits: { type: boolean }
                  read_withdrawals: { type: boolean }
                  default_read_deposits: { type: boolean }
                  default_read_withdrawals: { type: boolean }
                  deposit_keywords: { type: [array, 'null'], items: { type: string } }
                  withdrawal_keywords: { type: [array, 'null'], items: { type: string } }
                  parser_rule_version: { type: [integer, 'null'] }
                  parser_rule: { type: [object, array, 'null'], additionalProperties: true }
                  redacted_sample_message: { type: [string, 'null'] }
                  status: { type: string, enum: [active, paused] }
                  created_at: { type: [string, 'null'] }
                  updated_at: { type: [string, 'null'] }
            messages:
              type: array
              items:
                type: object
                required: [id, message_type, channel_id, amount_egp, received_at, status]
                properties:
                  id: { type: integer }
                  message_type: { type: string, enum: [deposit, withdrawal, ambiguous] }
                  channel_id: { type: integer }
                  amount_egp: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,2})?$' }
                  received_at: { type: string }
                  status: { type: string, enum: [new, registered, ignored, needs_review, archived] }
                  registered_source: { type: [string, 'null'], enum: [sms, notification, manual, null] }
                  registered_document_type: { type: [string, 'null'] }
                  registered_document_id: { type: [integer, 'null'] }
            server_time: { type: string, format: date-time }
    MobilePingResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [cursor, server_time]
          properties:
            cursor: { type: integer, minimum: 0 }
            server_time: { type: string, format: date-time }
    CustomerInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: [string, 'null'], maxLength: 32 }
        email: { type: [string, 'null'], format: email }
        address: { type: [string, 'null'], maxLength: 500 }
        salesperson: { type: [string, 'null'], maxLength: 160 }
        tax_number: { type: [string, 'null'], maxLength: 64 }
        payment_terms: { type: [string, 'null'], maxLength: 160 }
        governorate: { type: [string, 'null'], maxLength: 120 }
        credit_limit: { $ref: '#/components/schemas/EgpAmount' }
        notes: { type: [string, 'null'] }
        is_active: { type: boolean }
    InvoiceInput:
      type: object
      required: [customer_id, issue_date, lines]
      properties:
        customer_id: { type: integer, minimum: 1 }
        issue_date: { type: string, format: date }
        due_date: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [product_id, warehouse_id, quantity, unit_price_egp]
            properties:
              product_id: { type: integer, minimum: 1 }
              warehouse_id: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1 }
              unit_price_egp: { $ref: '#/components/schemas/EgpAmount' }
              discount_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
              description: { type: [string, 'null'], maxLength: 500 }
    InvoicePreview:
      type: object
      required: [lines, subtotal_egp, discount_amount_egp, tax_enabled, tax_rate, tax_calculation_method, tax_amount_egp, grand_total_egp, warnings]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [line_number, product_id, sku, product_name, warehouse_id, quantity, unit_price_egp, discount_amount_egp, tax_amount_egp, line_total_egp]
            properties:
              line_number: { type: integer }
              product_id: { type: integer }
              sku: { type: string }
              product_name: { type: string }
              warehouse_id: { type: integer }
              quantity: { type: integer }
              unit_price_egp: { $ref: '#/components/schemas/EgpAmount' }
              discount_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
              tax_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
              line_total_egp: { $ref: '#/components/schemas/EgpAmount' }
        subtotal_egp: { $ref: '#/components/schemas/EgpAmount' }
        discount_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
        tax_enabled: { type: boolean }
        tax_rate: { type: string }
        tax_calculation_method: { type: [string, 'null'], enum: [inclusive, exclusive, null] }
        tax_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
        grand_total_egp: { $ref: '#/components/schemas/EgpAmount' }
        warnings: { type: array, items: { $ref: '#/components/schemas/PreviewWarning' } }
    OrderPreview:
      type: object
      required: [lines, subtotal_egp, discount_amount_egp, tax_amount_egp, tax_applied, grand_total_egp, warnings]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [line_number, product_id, sku, product_name, quantity, unit_price_egp, line_total_egp]
            properties:
              line_number: { type: integer }
              product_id: { type: integer }
              sku: { type: string }
              product_name: { type: string }
              quantity: { type: integer }
              unit_price_egp: { $ref: '#/components/schemas/EgpAmount' }
              line_total_egp: { $ref: '#/components/schemas/EgpAmount' }
        subtotal_egp: { $ref: '#/components/schemas/EgpAmount' }
        discount_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
        tax_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
        tax_applied: { type: boolean, const: false }
        grand_total_egp: { $ref: '#/components/schemas/EgpAmount' }
        warnings: { type: array, items: { $ref: '#/components/schemas/PreviewWarning' } }
    ReturnPreview:
      type: object
      required: [lines, subtotal_egp, discount_amount_egp, tax_amount_egp, grand_total_egp, warnings]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [line_number, product_id, sku, description, warehouse_id, quantity, unit_price_egp, discount_amount_egp, tax_amount_egp, line_total_egp]
            properties:
              line_number: { type: integer }
              product_id: { type: integer }
              sku: { type: [string, 'null'] }
              description: { type: [string, 'null'] }
              warehouse_id: { type: integer }
              quantity: { type: integer }
              unit_price_egp: { $ref: '#/components/schemas/EgpAmount' }
              discount_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
              tax_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
              line_total_egp: { $ref: '#/components/schemas/EgpAmount' }
        subtotal_egp: { $ref: '#/components/schemas/EgpAmount' }
        discount_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
        tax_amount_egp: { $ref: '#/components/schemas/EgpAmount' }
        grand_total_egp: { $ref: '#/components/schemas/EgpAmount' }
        warnings: { type: array, items: { $ref: '#/components/schemas/PreviewWarning' } }
    ContainerReceiptPreview:
      type: object
      required: [allocation_basis, lines, total_landed_cost_allocated_egp]
      properties:
        allocation_basis: { type: string, enum: [value, quantity, manual] }
        lines:
          type: array
          items:
            type: object
            required: [container_line_id, product_id, warehouse_id, quantity]
            properties:
              container_line_id: { type: integer }
              product_id: { type: integer }
              warehouse_id: { type: integer }
              quantity: { type: integer }
              purchase_cost_egp: { $ref: '#/components/schemas/EgpAmount' }
              allocated_landed_cost_egp: { $ref: '#/components/schemas/EgpAmount' }
              line_cost_egp: { $ref: '#/components/schemas/EgpAmount' }
              unit_cost_egp: { $ref: '#/components/schemas/EgpAmount' }
        total_landed_cost_allocated_egp: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,14})(\\.[0-9]{1,2})?$' }
    PreviewWarning:
      type: object
      required: [code]
      properties:
        code: { type: string, enum: [insufficient_stock, credit_limit_exceeded] }
        product_id: { type: integer }
        product_name: { type: string }
        warehouse_id: { type: integer }
        requested_quantity: { type: integer }
        available_quantity: { type: integer }
        credit_limit_egp: { $ref: '#/components/schemas/EgpAmount' }
        current_balance_egp: { $ref: '#/components/schemas/EgpAmount' }
    GeneralSettings:
      type: object
      properties:
        company_name: { type: [string, 'null'] }
        company_address: { type: [string, 'null'] }
        company_phone: { type: [string, 'null'] }
        company_email: { type: [string, 'null'], format: email }
        company_tax_number: { type: [string, 'null'] }
        invoice_number_prefix: { type: [string, 'null'] }
        order_number_prefix: { type: [string, 'null'] }
        container_number_prefix: { type: [string, 'null'] }
    CollectionAllocation:
      type: object
      required: [document_id, amount_egp]
      properties:
        document_id: { type: integer, minimum: 1 }
        amount_egp: { $ref: '#/components/schemas/EgpAmount' }
    Error:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, AUTHENTICATION_FAILED, REAUTHENTICATION_FAILED, FORBIDDEN, CSRF_TOKEN_MISMATCH, VALIDATION_FAILED, STEP_UP_REQUIRED, HTTP_ERROR, INTERNAL_SERVER_ERROR]
            message: { type: string }
            details: { type: object, additionalProperties: true }
        meta:
          type: object
          properties:
            request_id: { type: [string, 'null'] }
  responses:
    AuthenticationFailed:
      description: Invalid username or password (AUTHENTICATION_FAILED).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ReauthenticationFailed:
      description: Password re-verification failed (REAUTHENTICATION_FAILED).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: Missing/expired session (UNAUTHENTICATED).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Permission is absent or denied by default (FORBIDDEN).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CsrfMismatch:
      description: X-CSRF-Token is missing or invalid (CSRF_TOKEN_MISMATCH).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: Request validation failed (VALIDATION_FAILED; field errors are in error.details).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    StepUpRequired:
      description: Reauthenticate to establish the 10-minute window (STEP_UP_REQUIRED).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: State/business-rule conflict (HTTP_ERROR, status 409).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource does not exist (HTTP_ERROR, status 404).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Request throttled by the API.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
