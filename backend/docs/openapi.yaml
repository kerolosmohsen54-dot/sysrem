                      customers: []
                      channels:
                        - id: 4
                          treasury_account_id: 9
                          name: 'Ã™ÂÃ™Ë†Ã˜Â¯Ã˜Â§Ã™ÂÃ™Ë†Ã™â€  Ã™Æ’Ã˜Â§Ã˜Â´ 1'
                          channel_type: wallet
                          identifier: '01000000000'
                          status: active
                          balance_egp: '250.75'
                      categories: []
                      sources:
                        - id: 7
                          device_id: 3
                          channel_id: 4
                          source_kind: sms
                          sender_identifier: WalletSender
                          notification_package_names: null
                          read_deposits: true
                          read_withdrawals: false
                          is_enabled: true
                          default_read_deposits: true
                          default_read_withdrawals: false
                          deposit_keywords: ['Deposit received']
                          withdrawal_keywords: []
