components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: precision_slate_session
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque device token
  parameters:
    ListPage: { name: page, in: query, required: false, description: "One-based page number., schema: { type: integer, minimum: 1, default: 1 }" }
    ListPerPage: { name: per_page, in: query, required: false, description: "Maximum 100 items; endpoint defaults may differ., schema: { type: integer, minimum: 1, maximum: 100 }" }
    ListSearch: { name: search, in: query, required: false, description: "Substring search across the endpoint's documented searchable fields., schema: { type: string, minLength: 1, maxLength: 160 }" }
    ListSortBy: { name: sort_by, in: query, required: false, description: "Endpoint-specific allowlisted sort field; unsupported values return 422., schema: { type: string }" }
    ListSortDirection: { name: sort_direction, in: query, required: false, description: "Sort direction; defaults to the endpoint's configured order., schema: { type: string, enum: [asc, desc] }" }
    CustomerId: { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ReceiptId: { name: receiptId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    AllocationId: { name: allocationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    DeliveryId: { name: deliveryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    WarehouseId: { name: warehouseId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ContainerId: { name: containerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    CountId: { name: countId, in: path, required: true, schema: { type: integer, minimum: 1 } }
  schemas:
    InventoryCount:
      type: object
      required: [id, count_number, warehouse_id, count_date, status, reason]
      properties:
        id: { type: integer }
        count_number: { type: string }
        warehouse_id: { type: integer }
        count_date: { type: string, format: date }
        status: { type: string, enum: [draft, approved, cancelled] }
        reason: { type: string }
        approved_by_user_id: { type: [integer, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
    InventoryCountLine:
      type: object
      required: [id, inventory_count_id, line_number, product_id, expected_quantity, counted_quantity, difference_quantity]
      properties:
        id: { type: integer }
        inventory_count_id: { type: integer }
        line_number: { type: integer }
        product_id: { type: integer }
        sku: { type: string }
        product_name: { type: string }
        expected_quantity: { type: integer, minimum: 0 }
        counted_quantity: { type: integer, minimum: 0 }
        difference_quantity: { type: integer }
        inventory_movement_id: { type: [integer, 'null'] }
    InventoryCountInput:
      type: object
      required: [warehouse_id, count_date, reason, idempotency_key, lines]
      properties:
        warehouse_id: { type: integer, minimum: 1 }
        count_date: { type: string, format: date }
        reason: { type: string, maxLength: 1000 }
        idempotency_key: { type: string, maxLength: 200 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, counted_quantity]
            properties:
              product_id: { type: integer, minimum: 1 }
              counted_quantity: { type: integer, minimum: 0 }
    InventoryCountResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [count, lines]
          properties:
            count: { $ref: '#/components/schemas/InventoryCount' }
            lines: { type: array, items: { $ref: '#/components/schemas/InventoryCountLine' } }
    InventoryCountList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/InventoryCount' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    MinimumStockItem:
      type: object
      required: [id, product_id, sku, product_name, warehouse_id, warehouse_code, warehouse_name, minimum_quantity, quantity_on_hand, is_below_minimum]
      properties:
        id: { type: integer }
        product_id: { type: integer }
        sku: { type: string }
        product_name: { type: string }
        warehouse_id: { type: integer }
        warehouse_code: { type: string }
        warehouse_name: { type: string }
        minimum_quantity: { type: integer, minimum: 0 }
        quantity_on_hand: { type: integer, minimum: 0 }
        is_below_minimum: { type: integer, enum: [0, 1] }
    MinimumStockInput:
      type: object
      required: [product_id, warehouse_id, minimum_quantity]
      properties:
        product_id: { type: integer, minimum: 1 }
        warehouse_id: { type: integer, minimum: 1 }
        minimum_quantity: { type: integer, minimum: 0 }
    MinimumStockResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MinimumStockItem' }
    MinimumStockList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MinimumStockItem' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ContainerTransfer:
      type: object
